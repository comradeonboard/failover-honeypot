services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend.py:/app/backend.py
      - ./tracking.py:/app/tracking.py
      - ./frontend/dist:/app/frontend/dist
      - backend_data:/app/data
    ports:
      - "8000:8000"
      - "2222:2222"
      - "8080:8080"
      - "2121:2121"
      - "2323:2323"
    command: ["python", "-m", "uvicorn", "backend:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      - backend
    restart: unless-stopped

  # Attacker hosts on the network — each runs in its own container with its
  # own real IP, continuously attacking the honeypots like internet botnets.
  attacker-1:
    image: python:3.12-slim
    volumes:
      - ./attacker:/attacker:ro
    command: ["python", "/attacker/bot.py", "backend"]
    depends_on:
      - backend
    restart: unless-stopped

  attacker-2:
    image: python:3.12-slim
    volumes:
      - ./attacker:/attacker:ro
    command: ["python", "/attacker/bot.py", "backend"]
    depends_on:
      - backend
    restart: unless-stopped

  attacker-3:
    image: python:3.12-slim
    volumes:
      - ./attacker:/attacker:ro
    command: ["python", "/attacker/bot.py", "backend"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_data:
